<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="none"/>
  
  <!-- Printer Icon -->
  <g transform="translate(50, 60)">
    <!-- Printer Body -->
    <rect x="10" y="30" width="80" height="50" rx="8" fill="#ffffff" stroke="none"/>
    
    <!-- Paper Tray -->
    <rect x="5" y="70" width="90" height="8" rx="2" fill="#2563eb" stroke="none"/>
    
    <!-- Paper Output -->
    <rect x="20" y="15" width="60" height="35" rx="2" fill="#f3f4f6" stroke="none"/>
    
    <!-- Control Panel -->
    <rect x="25" y="40" width="50" height="8" rx="4" fill="#2563eb" stroke="none"/>
    
    <!-- LED Indicators -->
    <circle cx="30" cy="44" r="2" fill="#10b981"/>
    <circle cx="38" cy="44" r="2" fill="#10b981"/>
    <circle cx="46" cy="44" r="2" fill="#f59e0b"/>
  </g>
  
  <!-- Company Initials -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">YSDP</text>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff">PRINTING</text>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>